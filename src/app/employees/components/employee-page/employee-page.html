<div class="employee-page">

  <!-- Page Header -->
  <header class="page-header">

    <div class="page-title">
      <span class="page-icon">👥</span>

      <div>
        <h1>Employee Management</h1>
        <p>Manage employees and their information</p>
      </div>
    </div>

    <button class="primary-button">
      + Add Employee
    </button>

  </header>


  <!-- Page Content -->
  <main class="page-content">

    <!-- Statistics -->
    <section class="statistics">

      <div class="stat-card">
        <div class="stat-icon">👥</div>

        <div>
          <span class="stat-label">Total Employees</span>
          <strong>{{_employees().length}}</strong>
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-icon">✓</div>

        <div>
          <span class="stat-label">Active Employees</span>
          <strong>115</strong>
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-icon">🏢</div>

        <div>
          <span class="stat-label">Departments</span>
          <strong>8</strong>
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-icon">⏳</div>

        <div>
          <span class="stat-label">Pending</span>
          <strong>13</strong>
        </div>
      </div>

    </section>

    <section>
      <br>
      <app-employee-grid
      [employees]="_employees()"></app-employee-grid>
      <br>
    </section>

    <!-- <section>
        <app-employee-table 
        [employees]="_employees()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"></app-employee-table>

    </section> -->

    <!-- Main Layout -->
    <section>

      <!-- Employee List -->
      <!-- <div class="employee-list-container">

        <app-employee-list 
        [employees]="_employees()"
        (edit)="onEdit($event)"
        (delete)="onDelete($event)"></app-employee-list>

      </div> -->


      <!-- Employee Form -->
      <div class="employee-form-container">

        <app-employee-form
        (add)="onSave($event)"
        [editingEmployee]="editingEmployee()"></app-employee-form>

      </div>

    </section>

  </main>

</div>
