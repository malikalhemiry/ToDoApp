<div class="container">
  <h1>📋 مدير المهام</h1>
  
  <app-task-form (add)="onAddTask($event)"></app-task-form>

  <app-task-list 
    [tasks]="tasks" 
    (toggle)="onToggleTask($event)" 
    (delete)="onDeleteTask($event)">
  </app-task-list>
</div>

<div class="container">
  <h1>Student Manager</h1>
  
  <!-- نموذج الإضافة -->
  <app-student-form 
  [student]="editingStudent()"
  (add)="onAddStudent($event)"></app-student-form>

  <app-student-list
    [students]="students()" 
    (edit)="onEditStudent($event)" 
    (toggle)="onToggleStudent($event)" 
    (delete)="onDeleteStudent($event)">
  </app-student-list>
</div>
